<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo de productos</title>
  <meta name="description" content="Mira los productos y precios, arma tu pedido y envíalo por WhatsApp.">
  <meta name="theme-color" content="#1a7f4b">
  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo de productos">
  <meta property="og:description" content="Mira los productos y precios, arma tu pedido y envíalo por WhatsApp.">
  <meta property="og:url" content="https://herbalife-beta.netlify.app/catalogo.html">
  <meta property="og:image" content="https://herbalife-beta.netlify.app/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_PE">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="public">
  <div id="splash" class="splash hidden">
    <div class="splash-logo"><img src="icons/icon.svg" alt=""></div>
    <div class="splash-name" id="splashName">Catálogo</div>
  </div>
  <script>(function(){try{if(!sessionStorage.getItem("splashShown")){var s=document.getElementById("splash");s.classList.remove("hidden");s.dataset.shownAt=Date.now();sessionStorage.setItem("splashShown","1");var n=localStorage.getItem("businessName");if(n)document.getElementById("splashName").textContent=n;}}catch(e){}})();</script>
  <header class="topbar">
    <div><h1 id="title">Catálogo</h1><div class="sub" id="subtitle">Cargando…</div></div>
    <div class="tools"><button class="iconbtn" data-theme-toggle aria-label="Cambiar tema">🌙</button></div>
  </header>
  <main>
    <div class="hero" id="hero"></div>
    <input type="search" class="search" id="search" placeholder="Buscar producto…">
    <div class="chips" id="categories"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty"><div class="big">📦</div>No hay productos disponibles por ahora.</div>
  </main>

  <div class="cartbar hidden" id="cartbar">
    <div><div class="muted small" id="cartCount">0 productos</div><div class="price" id="cartTotal">S/ 0.00</div></div>
    <button class="btn wa" id="btnCheckout">Hacer pedido</button>
  </div>

  <dialog id="dlgCheckout">
    <div class="dlg-head"><h2>Tu pedido</h2><button class="close" data-close>✕</button></div>
    <div class="dlg-body">
      <div id="checkoutItems"></div>
      <div class="totals" id="checkoutTotals"></div>
      <label class="mt"><span>Tu nombre</span><input type="text" id="buyerName" required placeholder="¿Cómo te llamas?"></label>
      <label><span>Tu celular (opcional)</span><input type="tel" id="buyerPhone" inputmode="tel" placeholder="999 999 999"></label>
      <label><span>Nota (opcional)</span><input type="text" id="buyerNote" placeholder="Ej. sabor, dirección de entrega"></label>
      <p class="error" id="checkoutError"></p>
      <button class="btn wa block" id="btnSend">Enviar pedido por WhatsApp</button>
    </div>
  </dialog>

  <dialog id="dlgProduct">
    <div class="dlg-head"><h2 id="pdName" class="ellipsis">Producto</h2><button class="close" data-close>✕</button></div>
    <div class="dlg-body">
      <div class="gallery" id="pdGallery"></div>
      <div class="dots" id="pdDots"></div>
      <div class="row between mt">
        <div><div class="old" id="pdOld"></div><div class="price" id="pdPrice" style="font-size:22px"></div></div>
        <div class="qty" id="pdQty"></div>
      </div>
      <p class="desc" id="pdDesc"></p>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
